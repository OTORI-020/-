<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ゴハンノジカン prototype</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#171512;color:#eee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#181612,#29241c)}button{font:inherit;color:inherit;background:#393229;border:1px solid #756652;border-radius:10px;padding:10px 12px}.app{max-width:760px;margin:auto;padding:12px}.top{display:flex;gap:8px;align-items:center}.top h1{font-size:18px;margin:0 auto 0 0}.char.active{outline:2px solid #ddd}.scene{margin-top:10px;min-height:390px;border:2px solid #5e513f;border-radius:14px;background:#2b261f;padding:16px;position:relative;overflow:hidden}.room{height:260px;border-radius:10px;background:linear-gradient(160deg,#54452f,#2d261d);position:relative;padding:16px}.room:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 65px,#0002 66px 68px);pointer-events:none}.room h2{position:relative;margin:0;font-size:24px}.spots{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}.spot{min-height:62px;background:#211d18cc}.msg{margin-top:12px;min-height:86px;background:#111b;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.55}.inv{margin-top:10px}.inv h3{font-size:14px;margin:0 0 6px}.items{display:flex;gap:7px;flex-wrap:wrap}.item.selected{outline:2px solid #eee}.status{font-size:12px;opacity:.75;margin-top:8px}.overlay{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.card{max-width:560px;background:#29241d;border:1px solid #756652;border-radius:14px;padding:22px;line-height:1.65}.card h2{margin-top:0}.hidden{display:none}.danger{background:#3c2020}.good{background:#203626}</style></head><body><div class="app">
<div class="top"><h1>ゴハンノジカン <small>PROTOTYPE</small></h1><button id="aBtn" class="char active">A</button><button id="bBtn" class="char">B</button><button id="reset">最初から</button></div>
<div class="scene"><div class="room"><h2 id="roomTitle"></h2><div class="spots" id="spots"></div></div><div class="msg" id="msg"></div></div>
<div class="inv"><h3>所持品（選択してから調べる）</h3><div class="items" id="items"></div><div class="status" id="status"></div></div></div>
<div id="overlay" class="overlay"><div class="card"><h2>ゴハンノジカン</h2><p>また喧嘩をした兄弟は、母親に納屋の別々の部屋へ閉じ込められた。</p><p>「二人で協力して、ちゃんと仲直りできたら出てきなさい。夕飯までに出られなかったら、今日はご飯抜きだからね！」</p><p>A「お前のせいでメシ抜きになったらどうすんだよ」<br>B「そっちこそ、さっさと出口探せよ」</p><button id="start">探索を始める</button></div></div>
<script>
const S={char:'A',sel:null,inv:{A:[],B:[]},f:{aHandle:false,bMark:false,drawer:false,bCup:false,aKey:false,bOpen:false,aPulley:false,rope:false,pulley:false,aMirror:false,bLamp:false,light:false,part:false,worked:false,exitKey:false,voice:false,sacrifice:false,bExit:false,final:false,bad:false,monster:false,monsterShelf:false,monsterTunnel:false},msg:'納屋を調べよう。'};
const names={handle:'変わった取っ手',key:'小さな鍵',rope:'ロープ',pulley:'滑車部品',mirror:'鏡',lamp:'ランタン',part:'木製部品',exitA:'Aの出口鍵',exitB:'Bの出口鍵'};
function has(x,c=S.char){return S.inv[c].includes(x)} function add(x,c=S.char){if(!has(x,c))S.inv[c].push(x)} function rem(x,c=S.char){S.inv[c]=S.inv[c].filter(v=>v!==x);if(S.sel===x)S.sel=null}
function say(x){S.msg=x;render()}
function transfer(){if(!S.f.drawer||!S.sel)return say('共有引き出しはまだ使えない。');let from=S.char,to=from==='A'?'B':'A',x=S.sel;rem(x,from);add(x,to);S.sel=null;say(`${names[x]}を引き出しに入れて${to}へ送った。\n向こう側で引き出しの動く音がした。`)}
function clickSpot(id){let c=S.char,f=S.f,sel=S.sel;
if(f.monster&&c==='A')return monster(id);
if(id==='drawer'){if(!f.drawer){if(c==='A'&&sel==='handle'&&f.bMark){rem('handle');f.drawer=true;return say('取っ手を取り付けて押すと、引き出しが壁の中へ滑り込んだ。\nB「おい！ こっちから出てきたぞ！」\n【共有引き出しが開通した】')} return say(c==='A'?'壁に埋め込まれた妙な収納。取っ手が欠けている。':'取っ手のない引き出し。奥で何かに繋がっているようだ。');} return transfer();}
if(c==='A'){
 if(id==='crate'&&!f.aHandle){f.aHandle=true;add('handle');return say('木箱の留め具を外した。中から【変わった取っ手】を見つけた。')}
 if(id==='wall'&&f.bMark&&!f.aKey){f.aKey=true;add('key');return say('Bが教えた印の順に板を押すと、隠し穴が開いた。\n【小さな鍵】を入手。')}
 if(id==='high'&&f.pulley&&!f.aMirror){f.aMirror=true;add('mirror');return say('滑車で降りてきた高所の箱を開けた。\n【鏡】を入手。')}
 if(id==='light'&&f.bLamp&&sel==='mirror'&&!f.light){f.light=true;return say('鏡をかざすと、Bのランタンの光が反射して壁に「314」と浮かんだ。\nA「おい、そっちの箱に314って入れてみろ！」')}
 if(id==='bench'&&sel==='part'&&!f.worked){f.worked=true;rem('part');add('part');return say('木製部品を作業台で削り、細い溝を作った。\nA「こっちの加工は終わった。そっちでも何かできないか？」')}
 if(id==='door'&&sel==='exitA'&&!f.sacrifice){rem('exitA');f.bad=true;f.monster=true;S.msg='扉が開いた。\n\nA「母さん！ ご褒美って――」\n\n……何かが、一瞬だけ見えた。\n\n暗転。';render();setTimeout(()=>{S.msg='扉の開いたAの部屋。\n\nA「今度はお前を脱出させないとな！」';render()},1200);return}
 if(id==='floor'&&sel==='exitA'&&!f.sacrifice){rem('exitA');f.sacrifice=true;f.bExit=true;add('exitB','B');return say('出口鍵を床の古い機構へ差し込む。無理に回すと――鍵は折れた。\nA「……やっちまった」\nB「お前、何して――うわっ！」\nB側で大きな収納が開いた。【Bの出口鍵】が現れた。')}
 if(id==='machine'&&sel==='exitB'&&f.sacrifice&&!f.final){rem('exitB');f.final=true;return say('Bから送られた出口鍵を地下機構へ差す。\nA「いいのか？ お前なら出られたのに」\nB「一人で出てまた怒られるのは御免だ」\n二つの部屋の床下から歯車の音が響く……。')}
 if(id==='floor'&&f.final)return trueEnd();
 } else {
 if(id==='marks'&&!f.bMark){f.bMark=true;return say('棚の裏に、三つの印と押す順番を発見した。\nB「A！ そっちの壁に同じ印ないか？」')}
 if(id==='cabinet'&&sel==='key'&&!f.bOpen){rem('key');f.bOpen=true;add('rope');return say('鍵が開いた！ 中から【ロープ】を入手。さらに奥に数字錠の箱がある。')}
 if(id==='pulley'&&sel==='rope'&&has('pulley','A')&&!f.pulley){rem('rope');rem('pulley','A');f.pulley=true;return say('Aが見つけた滑車部品とロープを組み合わせた。吊り棚が動き、A側の高所の箱が降りる。\n同時にB側では吊り棚の裏からランタンが出てきた。');}
 if(id==='pulley'&&f.pulley&&!f.bLamp){f.bLamp=true;add('lamp');return say('【ランタン】を取った。壁穴の前に置くと、光がA側へ漏れていく。')}
 if(id==='cabinet'&&f.light&&!f.part){f.part=true;add('part');return say('数字錠に314を入力。箱が開き【木製部品】を入手した。')}
 if(id==='vice'&&sel==='part'&&f.worked&&!f.exitKey){rem('part');f.exitKey=true;add('exitA','A');f.voice=true;return say('Aが削った部品を万力で曲げると、古い鍵の形になった。\n【Aの出口鍵】完成。\n\nその瞬間、納屋の外から母親の声がした。\n「二人ともー！ そろそろご飯の時間よ！ 早く出てきた方にはご褒美あげる！」')}
 if(id==='door'&&sel==='exitB'&&f.sacrifice){return say('これを使えばBは出られる。\n……だが、Aはもう自分の鍵を壊してしまった。')}
 if(id==='floor'&&f.final)return trueEnd();
 }
 say('今は特に何も起こらない。');}
function monster(id){let f=S.f;if(id==='shelf'&&!f.monsterShelf){f.monsterShelf=true;return say('重い棚を片手で持ち上げた。\nその下に、人間の力では開けられそうにない地下機構がある。\n\nA「B！ こっちに地下道があるみたいだ。そっちのレバーを動かしてくれ！」')};if(id==='machine'&&f.monsterShelf&&!f.monsterTunnel){f.monsterTunnel=true;return say('Bが向こう側から協力してくれた。地下機構が開く。\n偽Aは地下へ降り、Bの部屋へ続く通路を進んだ。\n\nB「お、来れたのか！ ……A？」\n\nそこでようやく、Bは目の前のものが兄弟ではないと気付いた。\n\nBAD END ― ゴハンノジカン')};say('今の身体なら壊せそうだが、それだけでは意味がない。Bの協力が必要だ。')}
function trueEnd(){document.getElementById('overlay').classList.remove('hidden');document.querySelector('#overlay .card').innerHTML=`<h2>TRUE END</h2><p>二つの床が開き、兄弟は地下でようやく顔を合わせた。</p><p>地下道は母屋へ続いていた。帰ると父親が驚きながら二人を迎える。</p><p>事情を聞いた父親は笑った。<br>「ちゃんと仲直りできたんだな。二人とも偉いぞ」</p><p>そして、ふと思い出したように言う。</p><p>「俺も見習わないとな。実は、お前たちを納屋に閉じ込めたことで母さんと言い合いになってね。怒って家を飛び出してから、まだ帰ってきてないんだ」</p><p>A「え？ じゃあ母さん、まだ納屋の外にいるんじゃない？」</p><h3>ゴハンノジカン</h3><button onclick="location.reload()">もう一度</button>`}
function render(){document.getElementById('aBtn').classList.toggle('active',S.char==='A');document.getElementById('bBtn').classList.toggle('active',S.char==='B');document.getElementById('roomTitle').textContent=(S.f.monster&&S.char==='A'?'A（？）':S.char)+'の部屋';let spots=[];if(S.char==='A')spots=S.f.monster?[['shelf','重い棚'],['machine','地下機構'],['drawer','共有引き出し'],['door','開いた扉']]:[['crate','木箱'],['wall','板壁'],['high','高所の箱'],['light','壁穴と光'],['bench','作業台'],['drawer','共有引き出し'],['door','外への扉'],['floor','床の古い機構'],['machine','地下機構']];else spots=[['marks','棚の裏'],['cabinet','戸棚／数字錠'],['pulley','吊り棚と滑車'],['vice','万力'],['drawer','共有引き出し'],['door','外への扉'],['floor','床']];document.getElementById('spots').innerHTML=spots.map(([id,n])=>`<button class="spot" onclick="clickSpot('${id}')">${n}</button>`).join('');document.getElementById('msg').textContent=S.msg;let inv=S.inv[S.char];document.getElementById('items').innerHTML=inv.length?inv.map(x=>`<button class="item ${S.sel===x?'selected':''}" onclick="S.sel=S.sel==='${x}'?null:'${x}';render()">${names[x]}</button>`).join(''):'（なし）';document.getElementById('status').textContent=S.f.drawer?'共有引き出し：使用可能':'共有引き出し：未開通';}
document.getElementById('aBtn').onclick=()=>{S.char='A';S.sel=null;render()};document.getElementById('bBtn').onclick=()=>{S.char='B';S.sel=null;render()};document.getElementById('reset').onclick=()=>location.reload();document.getElementById('start').onclick=()=>{document.getElementById('overlay').classList.add('hidden');render()};render();
</script></body></html>
