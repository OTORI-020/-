 if(c==='B'&&d==='right'){h+=hotspot('left:2%;top:20%;width:48%;height:70%','act(\'cabinet\')','戸棚')+hotspot('left:49%;top:15%;width:49%;height:75%','act(\'boards\')','板')}
 if(c==='B'&&d==='back'){h+=hotspot('left:5%;top:0%;width:90%;height:38%','act(\'shelfB\')','吊り棚')+hotspot('left:2%;top:44%;width:50%;height:48%','act(\'big\')','大型収納')+hotspot('left:51%;top:38%;width:47%;height:54%','act(\'input\')','入力装置')}
 if(c==='B'&&d==='left'){h+=hotspot('left:2%;top:25%;width:60%;height:65%','act(\'benchB\')','作業台')+hotspot('left:62%;top:18%;width:35%;height:70%','act(\'bDoor\')','出口扉')}
 st.innerHTML=h;renderInv()}
function renderInv(){let el=document.getElementById('inv'),arr=S.inv[S.char];el.innerHTML=arr.length?arr.map(x=>`<button class="item ${S.sel===x?'sel':''}" onclick="selectItem('${x}')">${nm[x]||x}</button>`).join(''):'<div class="empty">まだ何も持っていない</div>'}
function selectItem(x){S.sel=S.sel===x?null:x;say(S.sel?`「${nm[x]}」を選んだ。`:'アイテム選択を解除した。');renderInv()}
function act(id){let c=S.char,f=S.f,sel=S.sel;
 if(f.monster&&c==='A'&&id!=='floorA'&&id!=='tunnelA') return monsterAct(id);
 if(id==='aShelf'){S.focus='aShelf';return render()}
 if(id==='drawerB'){S.focus='drawerB';return render()}
 if(id==='aBox'){if(f.tag&&!f.aBox){f.aBox=true;f.pulleyPart=true;add('A','pulleyPart');return done('数字札の「317」を合わせると木箱が開いた。中から滑車の部品を手に入れた。')}return say(f.aBox?'空の木箱だ。':'3桁の錠が付いた木箱だ。')}
 if(id==='cabinet'){if(sel==='key'&&!f.bOpen){rem('B','key');f.bOpen=true;f.rope=true;f.tool=true;add('B','rope');add('B','tool');return done('小さな鍵が合った。戸棚の中からロープと工具を手に入れた。')}return say(f.bOpen?'開いた戸棚。':'小さな鍵穴のある戸棚だ。')}
 if(id==='boards'){if(sel==='tool'&&!f.tag){f.tag=true;add('B','tag');return done('工具で板を外した。裏から「317」と書かれた札が落ちた。')}return say(f.tag?'板は外れている。':'板で塞がれている。工具があれば外せそうだ。')}
 if(id==='pulleyA'){if(sel==='pulleyPart'&&!f.pulley){rem('A','pulleyPart');f.pulley=true;return done('滑車部品を取り付けた。壁の向こうまで縄が続いているようだ。')}return say(f.pulley?'滑車は使える状態だ。B側の何かと繋がっている。':'部品が一つ欠けた滑車だ。')}
 if(id==='shelfB'){if(f.pulley&&!f.bUnloaded){f.bUnloaded=true;return done('吊り棚の荷物を降ろした。棚が軽くなると、壁の向こうで大きな錘が動く音がした。')}return say(f.bUnloaded?'荷物を降ろした吊り棚。':'天井から吊られた重い棚だ。')}
 if(id==='high'){if(f.bUnloaded&&!f.aHigh){f.aHigh=true;f.mirror=true;add('A','mirror');return done('滑車が動いたことで高所の箱が降りてきた。中から鏡を手に入れた。')}return say(f.aHigh?'箱は空だ。':'高すぎて届かない箱がある。')}
 if(id==='bChest'){S.focus='bChest';return render()}
 if(id==='lampStand'){if(sel==='lamp'&&has('B','lens')&&!f.beam){f.beam=true;return done('ランタンを金属筒の後ろに置き、凸レンズで集光した。細い光が壁穴の奥へ伸びた。')}return say('壁へ向いた細い金属筒と、光源を固定できそうな台がある。光を集める部品も必要そうだ。')}
 if(id==='lightA'){if(f.beam&&sel==='mirror'&&!f.code){f.code=true;return done('壁穴から来た光を鏡で反射すると、壁に「△○□」の印が浮かび上がった。B側の装置に使えそうだ。')}return say(f.beam?'壁穴から細い光が差している。鏡で向きを変えられそうだ。':'小さな壁穴と、鏡を置けそうな台がある。')}
 if(id==='input'){if(f.code&&!f.bigOpen){f.bigOpen=true;f.blank=true;add('B','blank');return done('△○□の順に入力すると、大型収納が大きな音を立てて開いた。工作用の素材を入手した。')}return say(f.bigOpen?'入力装置は解除済みだ。':'記号を三つ入力する装置だ。')}
 if(id==='big'){return say(f.bigOpen?'開いた大型収納。中身は取り出した。':'入力装置と連動しているようだ。')}
 if(id==='benchB'){if(sel==='blank'&&!f.workedB){f.workedB=true;return done('素材に穴を開けた。まだ完成ではなさそうだ。A側なら別の加工ができるかもしれない。')}return say('穴開けや固定に使えそうな作業台だ。')}
 if(id==='benchA'){if(sel==='blank'&&f.workedB&&!f.workedA){f.workedA=true;return done('Bで穴を開けた素材を切削し、床板に合う形へ仕上げた。')}return say('切削や組み立てができそうな作業台だ。')}
 if(id==='floorA'){if(sel==='blank'&&f.workedA&&!f.floor){rem('A','blank');f.floor=true;f.exitA=true;add('A','exitA');return done('加工した部品を床板へ取り付けると隠し収納が開いた。中にはAの扉に合いそうな脱出器具がある。')} if(sel==='exitA'&&!f.sac){rem('A','exitA');f.sac=true;f.exitB=true;add('B','exitB');return done('脱出器具を床下の機構へ差し込むと、器具は折れて戻らなくなった。その直後、B側で大きな音がした。',true)} if(f.final)return trueEnd();return say(f.floor?'床下には、脱出器具と同じ形の差込口がある。':'しっかり固定された床板だ。')}
 if(id==='aDoor'){if(sel==='exitA'&&!f.sac)return badStart();return say('Aの出口扉。特殊な留め具で閉じられている。')}
 if(id==='bDoor'){if(sel==='exitB'&&!f.final)return say('これを使えばBだけは出られそうだ。……本当に使う？ Aへ渡すこともできる。');return say('Bの出口扉だ。')}
 if(id==='tunnelA'){if(f.final)return trueEnd();return say('石造りの地下入口。まだ閉じている。')}
}
function renderFocus(){let st=document.getElementById('stage'),f=S.f;
 if(S.focus==='drawerB'){let img=!f.drawer?'drawer_closed':(!f.drawerOpen?'drawer_recess':'drawer_bopen');let h=`<img src="${IMG[img]}"><button class="focusBack" onclick="S.focus=null;render()">戻る</button>`;h+=hotspot('left:18%;top:22%;width:64%;height:58%','drawerAction()','壁の凹み');st.innerHTML=h;renderInv();return}
 if(S.focus==='aShelf'){let h=`<img src="${IMG['A_front']}" style="transform:scale(1.65);transform-origin:82% 45%"><button class="focusBack" onclick="S.focus=null;render()">戻る</button>`;h+=hotspot('left:28%;top:8%;width:52%;height:35%','shelfFocus(\'upper\')','棚上部')+hotspot('left:25%;top:43%;width:58%;height:25%','shelfFocus(\'middle\')','棚中央')+hotspot('left:22%;top:67%;width:64%;height:27%','shelfFocus(\'drawer\')','引き出し');st.innerHTML=h;renderInv();return}
 if(S.focus==='bChest'){let h=`<img src="${IMG['B_front']}" style="transform:scale(2.05);transform-origin:18% 78%"><button class="focusBack" onclick="S.focus=null;render()">戻る</button>`;h+=hotspot('left:18%;top:25%;width:62%;height:25%','chestFocus(\'lid\')','蓋')+hotspot('left:18%;top:52%;width:62%;height:30%','chestFocus(\'latch\')','留め具');st.innerHTML=h;renderInv();return}
} 
function shelfFocus(part){let f=S.f;if(part==='upper'&&!f.aShelfClue){f.aShelfClue=true;return done('棚の瓶を退けると、背板に三本の浅い溝がある。中央だけ下向きだ。')}if(part==='middle'&&f.aShelfClue&&!f.aShelfLatch){f.aShelfLatch=true;return done('溝と同じ並びで三つの木片を押すと、下段で小さく「カチッ」と鳴った。')}if(part==='drawer'&&f.aShelfLatch&&!f.aHandle){f.aHandle=true;add('A','handle');return done('解除された小引き出しを開ける。中に、二本のネジ足が付いた変わった取っ手が入っていた。')}if(part==='drawer'&&f.aHandle&&f.bMark&&!f.drawer){f.drawer=true;return done('Bで見つけた壁の印と棚の刻印を合わせて操作すると、奥で「ガコン」と何かが動いた。引き出しが壁の中へ深く続いている。',true)}return say(part==='drawer'?'小引き出しはまだ何かに引っ掛かっている。':'古い瓶や木片が並んでいる。');}
function chestFocus(part){let f=S.f;if(part==='lid'&&!f.bChestClue){f.bChestClue=true;return done('蓋は開かない。だが蝶番側を押すと、正面の留め具が少し浮く。')}if(part==='latch'&&f.bChestClue&&!f.bChestOpen){f.bChestOpen=true;f.lamp=true;f.lens=true;add('B','lamp');add('B','lens');return done('浮いた留め具を横へずらすと箱が開いた。中から小型ランタンと凸レンズを手に入れた。')}return say(f.bChestOpen?'空になった小箱だ。':'小さな金属箱。鍵穴はない。');} 
function drawerAction(){let f=S.f,sel=S.sel;if(!f.drawer){if(!f.bMark){f.bMark=true;return done('壁をよく見ると、ごく薄い四角い継ぎ目と二つの小穴がある。B「なんだこれ……？」')}return say('普通の壁にしか見えない。薄い継ぎ目と小穴だけがある。')}
 if(!f.drawerOpen){f.drawerOpen=true;return done('A側の引き出しが開いたままになっている。その分だけB側の壁が深く凹んでいる！ 奥は引き出しの底そのものだ。')}
 if(sel==='handle'&&has('B','handle')){return say('取っ手はもうこちら側にある。')}
 return say('壁が四角く深く凹んでいる。A側の引き出しと繋がっているようだ。取っ手用らしい二つの穴もある。')}
function transferSelected(){let f=S.f;if(!f.drawerOpen)return say('まだ物を受け渡せる状態ではない。');let c=S.char,o=c==='A'?'B':'A',x=S.sel;if(!x)return say('渡すアイテムを選んでいない。');rem(c,x);add(o,x);S.sel=null;done(`${nm[x]}を引き出しに入れて${o}側へ渡した。`) }
function done(t,flash=false){say('<b>'+t+'</b>');render();save()}
function badStart(){rem('A','exitA');showCard('<h2>扉が開いた。</h2><p>外は妙に静かだった。</p><p>母さん？</p><p>暗がりで、何かが動いた。</p><hr><p>……</p><button onclick="monsterPhase()">続ける</button>')}
function monsterPhase(){closeCard();S.f.monster=true;S.char='A';S.dir.A='front';say('A「……今度はお前を脱出させないとな！」');render()}
function monsterAct(id){let f=S.f;if(id==='aShelf'&&!f.monsterShelf){f.monsterShelf=true;return done('重い収納棚を片手で持ち上げた。人間にはできない。棚の下から地下機構が現れた。')}if(id==='floorA'&&f.monsterShelf&&!f.bHelp){return say('地下機構はB側から固定しないと開かない。Bに「出口を見つけた」と伝えれば……。')}return say('今の身体なら壊せそうだ。だが、壊すだけではBの部屋へは行けない。')}
function monsterHelp(){S.f.bHelp=true;showCard('<p>B「分かった。こっちのレバーを固定する！」</p><p>地下で錠が外れる音がした。</p><p>偽Aは暗い通路へ降りていく。</p><p>その先には、Bの部屋がある。</p><div class="end">BAD END<br>ゴハンノジカン</div><button onclick="resetGame();closeCard()">最初から</button>')}
function tryFinal(){if(S.f.sac&&has('B','exitB')){say('B用脱出器具には、A側の地下機構と同じ形の突起がある。共有引き出しでAへ渡せそうだ。')} }
function trueEnd(){showCard('<p>両方の床で機構が噛み合い、地下への階段が開いた。</p><p>二人は地下道を抜け、母屋へ戻る。</p><p>父「お前たち、仲直りしたのか。……俺も見習わないとな。さっき母さんと喧嘩してな。怒って家を出て、まだ帰ってきてないんだ」</p><p>A「え？ じゃあ、さっき納屋の外から呼んでたのは……？」</p><div class="end">TRUE END<br>ゴハンノジカン</div><button onclick="resetGame();closeCard()">最初から</button>')}
function showCard(x){document.getElementById('card').innerHTML=x;document.getElementById('overlay').style.display='flex'}function closeCard(){document.getElementById('overlay').style.display='none'}
function showHelp(){showCard('<h2>遊び方</h2><p>左右の矢印で部屋を4方向に見回します。画面内の家具や仕掛けを直接タップして調べます。</p><p>A/Bボタンで兄弟を切り替えます。所持品を選択してから対象をタップすると使用できます。</p><p>共有引き出しが開通した後は、アイテムを選んだ状態で引き出しの注目画面を調べると受け渡しできます。</p><button onclick="closeCard()">閉じる</button>')}
function toggleDebug(){S.debug=!S.debug;render();say(S.debug?'調べられる範囲を赤く表示した。':'調査範囲を隠した。')}
// special: global tap transfer and late-game hooks
const oldDrawer=drawerAction;drawerAction=function(){if(S.f.drawerOpen&&S.sel){return transferSelected()}return oldDrawer()}
const oldAct=act;act=function(id){if(S.f.monster&&S.char==='B'&&id==='input'&&!S.f.bHelp){return monsterHelp()}if(S.char==='A'&&id==='floorA'&&S.sel==='exitB'&&S.f.sac&&!S.f.final){rem('A','exitB');S.f.final=true;return done('Bが渡した脱出器具を地下機構へ差し込む。両室の床下で巨大な機構が動き始めた。',true)}return oldAct(id)}
window.onload=()=>{let q=localStorage.getItem('gohan4');if(q){try{S=JSON.parse(q);render();say('前回の状態を復元した。')}catch(e){start()}}else start()}
</script></body></html>
